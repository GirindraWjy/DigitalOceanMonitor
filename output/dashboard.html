<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>DigitalOcean Monitor</title>

  <style>
    :root {
      color-scheme: dark;
      --background: #1e1f22;
      --card-background: #222427;
      --border: #303236;
      --grid: #34373b;
      --text: #e5e7eb;
      --muted: #92979e;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 28px;
      color: var(--text);
      background: var(--background);
      font-family: Arial, Helvetica, sans-serif;
    }

    header {
      display: flex;
      align-items: flex-start;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 24px;
    }

    h1 {
      margin: 0 0 8px;
      font-size: 26px;
      font-weight: 600;
    }

    h2 {
      margin: 0;
      font-size: 16px;
      font-weight: 500;
    }

    .muted {
      color: var(--muted);
      font-size: 12px;
      line-height: 1.7;
    }

    .badge {
      padding: 8px 12px;
      color: #86efac;
      background: #183525;
      border: 1px solid #285538;
      border-radius: 6px;
      font-size: 12px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 16px;
    }

    .card {
      min-width: 0;
      padding: 18px;
      background: var(--card-background);
      border: 1px solid var(--border);
      border-radius: 8px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 12px;
    }

    .chart-wrap {
      width: 100%;
      margin-top: 16px;
    }

    .chart-svg {
      display: block;
      width: 100%;
      height: auto;
      overflow: visible;
    }

    .chart-grid {
      stroke: var(--grid);
      stroke-width: 1;
      opacity: 0.7;
    }

    .chart-line {
      fill: none;
      stroke-width: 1.6;
      stroke-linejoin: round;
      stroke-linecap: round;
    }

    .chart-area {
      stroke: none;
    }

    .chart-point {
      stroke-width: 1.5;
    }

    .chart-value {
      fill: #c1c5ca;
      font-size: 10px;
      text-anchor: middle;
    }

    .chart-y-label {
      fill: #92979e;
      font-size: 10px;
      text-anchor: end;
    }

    .chart-time {
      fill: #777d83;
      font-size: 10px;
      text-anchor: middle;
    }

    .legend {
      display: flex;
      flex-wrap: wrap;
      gap: 10px 14px;
      margin-top: 14px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: #c1c5ca;
      font-size: 11px;
    }

    .legend-line {
      display: inline-block;
      width: 15px;
      height: 3px;
      border-radius: 2px;
    }

    .empty {
      padding: 36px 8px;
      color: var(--muted);
      text-align: center;
      font-size: 13px;
    }

    footer {
      margin-top: 22px;
      color: #777d83;
      font-size: 11px;
      line-height: 1.7;
    }

    @media (max-width: 850px) {
      body {
        padding: 16px;
      }

      .grid {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

    function niceNumber(value, round = false) {
      if (!Number.isFinite(value) || value <= 0) {
        return 1;
      }

      const exponent = Math.floor(Math.log10(value));
      const fraction = value / (10 ** exponent);

      let niceFraction;

      if (round) {
        if (fraction < 1.5) {
          niceFraction = 1;
        } else if (fraction < 3) {
          niceFraction = 2;
        } else if (fraction < 7) {
          niceFraction = 5;
        } else {
          niceFraction = 10;
        }
      } else {
        if (fraction <= 1) {
          niceFraction = 1;
        } else if (fraction <= 2) {
          niceFraction = 2;
        } else if (fraction <= 5) {
          niceFraction = 5;
        } else {
          niceFraction = 10;
        }
      }

      return niceFraction * (10 ** exponent);
    }

    function calculateYAxis(values, tickCount = 4) {
      const min = Math.min(...values);
      const max = Math.max(...values);

      // Beri ruang saat semua nilai sama.
      if (min === max) {
        const padding = Math.abs(min) * 0.05 || 1;
        const lower = min - padding;
        const upper = max + padding;
        const step = niceNumber(
          (upper - lower) / tickCount,
          true
        );

        return {
          min: Math.floor(lower / step) * step,
          max: Math.ceil(upper / step) * step,
          step
        };
      }

      const rawStep = (max - min) / tickCount;
      const step = niceNumber(rawStep, true);

      return {
        min: Math.floor(min / step) * step,
        max: Math.ceil(max / step) * step,
        step
      };
    }

      });

      const legend = document.createElement("div");
      legend.className = "legend";

      chartWrap.appendChild(svg);
      card.append(header, chartWrap, legend);

      const hasData = drawChart(
        svg,
        seriesList,
        definition.key
      );

      if (!hasData) {
        chartWrap.innerHTML = "";

        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent =
          "Tidak ada data numerik dalam rentang ini.";

        chartWrap.appendChild(empty);
      }

      // Legend menggunakan warna yang sama dengan grafik.
      seriesList.forEach((series, index) => {
        if (!series.points || !series.points.length) {
          return;
        }

        const color = getSeriesColor(
          definition.key,
          series.name,
          index
        );

        const item = document.createElement("div");
        item.className = "legend-item";

        const line = document.createElement("span");
        line.className = "legend-line";
        line.style.backgroundColor = color;

        const label = document.createElement("span");
        label.textContent = series.name;

        item.append(line, label);
        legend.appendChild(item);
      });

      dashboard.appendChild(card);
    });
  </script>
</body>
</html>
